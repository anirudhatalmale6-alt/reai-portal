<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="REAI">
    <meta name="theme-color" content="#0f1117">
    <title>REAI - Real Estate AI Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1117;
            color: #e4e6ef;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .logo { font-size: 48px; font-weight: 700; color: #6366f1; margin-bottom: 8px; }
        .sub { color: #8b8fa3; font-size: 16px; margin-bottom: 32px; }
        .status { font-size: 14px; color: #8b8fa3; margin-bottom: 24px; }
        .status.connecting { color: #f59e0b; }
        .status.connected { color: #22c55e; }
        .status.error { color: #ef4444; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #2e3345; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn { display: inline-block; padding: 12px 24px; background: #6366f1; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; text-decoration: none; margin-top: 16px; }
        .btn:hover { background: #818cf8; }
    </style>
</head>
<body>
    <div class="logo">REAI</div>
    <div class="sub">Real Estate AI Assistant</div>
    <div class="status connecting" id="status"><span class="spinner"></span>Connecting to REAI server...</div>
    <a class="btn" id="launch-btn" style="display:none" href="#">Launch REAI</a>
    <script>
        async function connect() {
            const statusEl = document.getElementById('status');
            const btnEl = document.getElementById('launch-btn');
            try {
                const resp = await fetch('https://raw.githubusercontent.com/anirudhatalmale6-alt/reai-portal/main/tunnel.json?t=' + Date.now());
                const data = await resp.json();
                if (data.url) {
                    // Test if tunnel is alive
                    try {
                        const check = await fetch(data.url + '/api/health', { mode: 'no-cors', signal: AbortSignal.timeout(5000) });
                        statusEl.className = 'status connected';
                        statusEl.innerHTML = '&#10003; Server is online';
                    } catch(e) {
                        statusEl.className = 'status connected';
                        statusEl.innerHTML = '&#10003; Redirecting...';
                    }
                    btnEl.href = data.url;
                    btnEl.style.display = 'inline-block';
                    // Auto-redirect after brief pause
                    setTimeout(() => { window.location.href = data.url; }, 1500);
                } else {
                    statusEl.className = 'status error';
                    statusEl.textContent = 'Server URL not available. Please try again in a few minutes.';
                }
            } catch(e) {
                statusEl.className = 'status error';
                statusEl.textContent = 'Could not reach server. Please try again shortly.';
                btnEl.style.display = 'none';
            }
        }
        connect();
    </script>
</body>
</html>
